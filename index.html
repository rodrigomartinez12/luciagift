<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Caja Misteriosa</title>
    <style>
      body {
        width: 100%;
        display: flex;
        justify-content: center;
        background-size: cover;
        background-image: url("https://st.depositphotos.com/34144898/56171/i/450/depositphotos_561718076-stock-photo-raindrops-on-the-glass-against.jpg");
        font-family: 'Comic Sans MS', cursive;
        text-align: center;
        background-color: #2f0f3;
        margin: 0;
        padding: 2rem;
        color: white;
      }
      .box {
        width: 80%;
        border: 3px dashed #d4a373;
        background-color: #9924FF;
        padding: 2rem;
        border-radius: 20px;
        border-color: #C97FFF;
        cursor: pointer;
        transition: transform 0.2s;
        opacity: 1;
      }
      .box:hover {
        transform: scale(1.05);
      }
      .hidden {
        display: none;
      }
      #scene img {
        max-width: 200px;
      }
      button {
        margin-top: 2rem;
        padding: 1rem 2rem;
        background-color: #f08080;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background-color: #e66a6a;
      }
      .happy {
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.05); }
        100% { transform: scale(1); }
      }
      img {
        border-radius: 10px;
        border: 1px solid white;
      }
    </style>
  </head>
  <body>
    <div class="background">
      <div id="start" class="box">
        <h2>¿Y si esa noche no me dabas el beso en el cachete?</h2>
        <p>Haz clic para abrir la caja...</p>
      </div>

      <div id="scene" class="hidden">
        <div id="sadScene">
          <img src="https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-e8c0-61f7-a10f-c68258319325/raw?se=2025-05-03T20%3A14%3A17Z&sp=r&sv=2024-08-04&sr=b&scid=a7c35a06-2991-5b8c-860a-83acc6890027&skoid=7c382de0-129f-486b-9922-6e4a89c6eb7d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2025-05-02T20%3A35%3A16Z&ske=2025-05-03T20%3A35%3A16Z&sks=b&skv=2024-08-04&sig=7NjrDWEQhlemYF66VdWY0p4u%2BsnHE61d4K94nlOZIzs%3D" alt="Lluvia triste">
          <p>Yo caminando bajo la lluvia, sin tu beso 😢</p>
          <button onclick="giveTheKiss()">¡Darle el beso igual!</button>
        </div>

        <div id="happyScene" class="hidden happy">
          <img src="https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-e16c-622f-9d93-95e46b2292b5/raw?se=2025-05-03T20%3A14%3A17Z&sp=r&sv=2024-08-04&sr=b&scid=3be6f5ef-f953-5028-ba19-bda203f5c99d&skoid=7c382de0-129f-486b-9922-6e4a89c6eb7d&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2025-05-02T20%3A35%3A18Z&ske=2025-05-03T20%3A35%3A18Z&sks=b&skv=2024-08-04&sig=ZuRHnHTxNYJiMvYA5nOttxneZFsGLUK8lEH7Ldirfug%3D" alt="Corazones felices">
          <h2>¡Todo gracias a ese beso!</h2>
          <p>Charlas, música, baile y... 💖</p>
          <p><strong>¡Quiero verte de nuevo!</strong></p>
        </div>
      </div>
    </div>

    <script>
      const startBox = document.getElementById("start");
      const scene = document.getElementById("scene");
      const sadScene = document.getElementById("sadScene");
      const happyScene = document.getElementById("happyScene");

      startBox.addEventListener("click", () => {
        startBox.classList.add("hidden");
        scene.classList.remove("hidden");
      });

      function giveTheKiss() {
        sadScene.classList.add("hidden");
        happyScene.classList.remove("hidden");
      }
    </script>
  </body>
</html>
